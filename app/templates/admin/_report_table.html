<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="overflow-x-auto">
    <table class="min-w-[70rem] w-full text-left text-sm">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-5 py-4">Report</th><th class="px-5 py-4">Submitted</th><th class="px-5 py-4">Status</th><th class="px-5 py-4">Classification</th><th class="px-5 py-4">Risk</th><th class="px-5 py-4">Review</th></tr></thead>
      <tbody class="divide-y divide-slate-100">
        {% for report in reports %}
        <tr data-report-id="{{ report.id }}" class="cursor-pointer hover:bg-slate-50">
          <td class="max-w-sm px-5 py-4"><button type="button" data-open-report="{{ report.id }}" class="max-w-full text-left hover:underline"><span class="block truncate font-bold text-ink">{{ report.title }}</span><span class="mt-1 block text-xs font-semibold text-slate-500">{{ report.reference_code }} · {{ report.crime_type|title }}</span></button></td>
          <td class="whitespace-nowrap px-5 py-4 text-slate-600">{{ report.created_at.strftime('%d %b %Y') }}</td>
          <td class="px-5 py-4"><span class="rounded-full px-2.5 py-1 text-xs font-bold capitalize {{ 'bg-amber-50 text-amber-700' if report.status == 'pending' else 'bg-emerald-50 text-emerald-700' if report.status == 'approved' else 'bg-red-50 text-red-700' }}">{{ report.status }}</span></td>
          <td class="px-5 py-4"><select data-action="classification" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm">{% for crime_type in crime_types %}<option value="{{ crime_type.name }}" {{ 'selected' if report.crime_type == crime_type.name }}>{{ crime_type.name.title() }}</option>{% endfor %}</select></td>
          <td class="px-5 py-4"><select data-action="risk_level" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm">{% for level in ['high', 'medium', 'low'] %}<option value="{{ level }}" {{ 'selected' if report.risk_level == level }}>{{ level.title() }}</option>{% endfor %}</select></td>
          <td class="px-5 py-4">{% if report.status == 'pending' %}<div class="flex gap-2"><button data-action="approve" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-bold text-white hover:bg-emerald-700">Approve</button><button data-action="reject" class="rounded-lg bg-red-600 px-3 py-1.5 text-xs font-bold text-white hover:bg-red-700">Reject</button></div>{% else %}<span class="text-xs font-bold capitalize text-slate-600">{{ report.status }}</span>{% endif %}</td>
        </tr>
        {% else %}<tr><td colspan="6" class="px-5 py-10 text-center text-slate-500">No reports match these filters.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
